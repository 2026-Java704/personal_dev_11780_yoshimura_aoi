<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク新規登録</title>
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>
	<!--	<header th:replace="~{header}"></header>-->
	<hr>

	<main>
		<form action="/tasks/add" method="post">
			<table border="1">
				<tr>
					<th>タイトル</th>
					<th><input type="text" name="title"></th>
				</tr>
				<tr>
					<th>カテゴリー</th>
					<th>
						<select name="categoryId">
							<option th:each="category : ${categories}" th:value="${category.id}"
								th:text="${category.name}" ></option>
						</select>
					</th>
				</tr>
				<tr>
					<th>期日</th>
					<th><input type="date" name="deadline"></th>
				</tr>
				<tr>
					<th>重要度</th>
					<th>
						<label><input type="radio" value="0" name="importance" checked>低</label>
						<label><input type="radio" value="1" name="importance">中</label>
						<label><input type="radio" value="2" name="importance">高</label>
					</th>
				</tr>
				<tr>
					<th>ルーティーン</th>
					<th>
						<label><input type="radio" value="0" name="routine" checked>無</label>
						<label><input type="radio" value="1" name="routine">有</label>
					</th>
				</tr>
				<tr>
					<th>備考</th>
					<th><textarea name="memo"></textarea></th>
				</tr>
			</table>
			<button>新規登録</button>
		</form>
	</main>
	<hr>
	<!--	<footer th:replace="~{footer}"></footer>-->
</body>

</html>
