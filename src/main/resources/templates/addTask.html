<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>タスク新規登録</title>
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>
		<header th:replace="~{header}"></header>
	<hr>

	<main>
		<p id="pcolor" th:if="${errorList}" th:each="error:${errorList}" th:text="${error}"></p>
		<form action="/tasks/add" method="post">
			<table border="1">
				<tr>
					<th>タイトル</th>
					<td><input type="text" name="title" th:value="${tasks.title}"></td>
				</tr>
				<tr>
					<th>カテゴリー</th>
					<td>
						<select name="categoryId">
							<option th:each="category : ${categories}" th:value="${category.id}"
								th:text="${category.name}" ></option>
						</select>
					</td>
				</tr>
				<tr>
					<th>期日</th>
					<td><input type="date" name="deadline" th:value="${tasks.deadline}"></td>
				</tr>
				<tr>
					<th>重要度</th>
					<td>
						<input type="radio" value="0" name="importance" th:checked="${tasks.importance==0}"><label>低</label>
						<input type="radio" value="1" name="importance" th:checked="${tasks.importance==1}"><label>中</label>
						<input type="radio" value="2" name="importance" th:checked="${tasks.importance==2}"><label>高</label>
					</td>
				</tr>
				<tr>
					<th>ルーティーン</th>
					<td>
						<label><input type="radio" value="0" name="routine" th:checked="${tasks.routine==0}">無</label>
						<label><input type="radio" value="1" name="routine" th:checked="${tasks.routine==1}">有</label>
					</td>
				</tr>
				<tr>
					<th>備考</th>
					<td><textarea name="memo"></textarea></td>
				</tr>
			</table>
			<span class="parent-center">
			<button>新規登録</button>
		</form>
		<form action="/tasks" method="get">
			<button>戻る</button>
		</form>
		</span>
	</main>
	<hr>
		<footer th:replace="~{footer}"></footer>
</body>

</html>
