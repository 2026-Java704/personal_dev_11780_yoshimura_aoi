<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>
	<link rel="stylesheet" href="/css/style.css">
</head>

<body>
	<header id="bg-h1">
		<h1><a class="header-a1">ToDoList</a></h1>
	</header>
	<main>
		<p id="pcolor" th:if="${errorList}" th:each="error:${errorList}" th:text="${error}"></p>
		<form action="/login" method="post">
			<input type="text" name="email" th:value="${email}" placeholder="メールアドレス"><br>
			<input type="password" name="password" placeholder="パスワード"><br><br>
			<button>ログイン</button>
		</form><br>
		<a href="/account">新規会員登録はこちら</a>
	</main>
	<footer th:replace="~{footer}"></footer>
</body>

</html>
